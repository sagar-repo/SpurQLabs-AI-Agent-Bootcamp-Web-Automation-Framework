name: SpurQL QA CI

"on":
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up javascript
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Write SpurQuality credentials
        shell: bash
        env:
          SPURQUALITY_EMAIL: ${{ secrets.SPURQUALITY_EMAIL }}
          SPURQUALITY_SECRET_KEY: ${{ secrets.SPURQUALITY_SECRET_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src/config/SpurQualityConfig.json";
            const data = JSON.parse(fs.readFileSync(path, "utf8"));
            data.email = process.env.SPURQUALITY_EMAIL;
            data.userSecretKey = process.env.SPURQUALITY_SECRET_KEY;
            fs.writeFileSync(path, JSON.stringify(data, null, 2));
          '

      - name: Run tests
        env:
          SPURQUALITY_ENABLED: 'true'
        run: node src/config/runner.js --tags "@Smoke"
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports


# NOTE: SpurQuality push is ON. Before this workflow's first real run, add two repo secrets
# (Settings -> Secrets and variables -> Actions): SPURQUALITY_EMAIL and SPURQUALITY_SECRET_KEY.
# The committed config file's placeholder values are only overwritten in-memory on the runner --
# your real secret is never written back into the repo.
